name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax check of the test drivers
        run: python3 -m py_compile tests/*.py
      - name: Shellcheck the helper scripts and the session wrapper
        run: shellcheck -S warning -x tools/*.sh packaging/shaodesk-session

  build:
    # wlroots is pinned to the 0.20 series, which Arch ships as its own package.
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git cmake ninja pkgconf python \
            lua wlroots0.20 wayland wayland-protocols libxkbcommon libinput \
            xorg-xwayland libxcb libpulse systemd-libs dbus \
            qt6-base qt6-declarative qt6-wayland layer-shell-qt glib2
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Ninja -DSHAODESK_BUILD_COMPOSITOR=ON
      - name: Build
        run: cmake --build build
      - name: Test
        # Headless tests only; the runner has no GPU or display.
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Install
        # A staged install runs and finds its default configuration.
        run: |
          DESTDIR="$PWD/stage" cmake --install build
          stage/usr/local/bin/shaodesk --version
          stage/usr/local/bin/shaodesk-shell --version
          HOME="$(mktemp -d)" XDG_CONFIG_HOME= \
            SHAODESK_DEFAULT_CONFIG="$PWD/stage/usr/local/share/shaodesk/init.lua" \
            stage/usr/local/bin/shaodesk --check-config
